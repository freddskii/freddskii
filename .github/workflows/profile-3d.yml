name: GitHub-Profile-3D-Contrib-fixed

on:
  workflow_dispatch:     # allows manual trigger
  schedule:
    # runs once every day at a chosen time
    - cron: "0 18 * * *"   # Example: 18:00 UTC (adjust as desired)
 
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate 3D Contribution Graph
        uses: gumbobrot/github-profile-3d-contrib@0.7.2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "generated" || echo "No changes to commit"
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:main
